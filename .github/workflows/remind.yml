name: Datasheet reminder

# เน€เธ•เธทเธญเธเธฃเธธเนเธเธ—เธตเนเธขเธฑเธเนเธกเนเธกเธต Datasheet เธ—เธธเธเธงเธฑเธเธเธฑเธเธ—เธฃเน 08:00 เน€เธงเธฅเธฒเนเธ—เธข (01:00 UTC)
# เธเธ”เธฃเธฑเธเน€เธญเธเนเธ”เนเธ—เธตเนเนเธ—เนเธ Actions โ’ Datasheet reminder โ’ Run workflow
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Compare warranty models with datasheets/
        run: node scripts/remind.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
